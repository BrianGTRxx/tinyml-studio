boards:
- id: arduino-uno-r3
  name: Arduino UNO R3
  vendor: Arduino
  family: Arduino
  soc: ATmega328P
  cpu: AVR 8 bits
  cores: null
  clock_mhz: 16
  arch: avr
  fpu: false
  sram_kb: 2
  flash_kb: 32
  usable:
    ram_kb: 0.8
    flash_kb: 24
    rule: '40 % de la SRAM (heurística nuestra); flash menos bootloader/reserva (supuesto nuestro): 0,5 KB de bootloader +
      ~8 KB de runtime/sketch'
  ai_tier: classical_only
  ai_note: '2 KB de SRAM y 32 KB de flash en un AVR de 8 bits sin FPU. TFLM NO cabe ni funciona: exige 32 bits, un arena de
    tensores de varios KB y decenas de KB de flash solo para el intérprete. Solo caben árboles de decisión muy pequeños o
    modelos lineales/umbrales en C (enteros, sin float eficiente), con muy pocas características. Discrepancia: el manual
    de usuario dice ''hasta 20 MHz'' (límite del chip); la placa usa un resonador de 16 MHz.'
  accelerators: []
  runtimes:
  - código C (clásicos)
  evidence:
  - field: clock_mhz
    value: 16 MHz
    url: https://docs.arduino.cc/resources/datasheets/A000066-datasheet.pdf
    note: 'Datasheet A000066 (modificado 21/10/2026), p. 2 y 6 (leído): ''AVR CPU at up to 16 MHz''; el procesador ATmega328P
      ''running at up to 20 MHz'' (límite del chip); la placa usa 16 MHz.'
  - field: sram_kb
    value: 2 KB
    url: https://docs.arduino.cc/resources/datasheets/A000066-datasheet.pdf
    note: 'Datasheet A000066 (modificado 21/10/2026), p. 2 (leído): 2 kB de SRAM.'
  - field: flash_kb
    value: 32 KB
    url: https://docs.arduino.cc/resources/datasheets/A000066-datasheet.pdf
    note: 'Datasheet A000066 (modificado 21/10/2026), p. 2 (leído): 32 kB de flash (los 0,5 KB del bootloader salen de la
      tienda de Arduino, no del datasheet).'
  verified: true
  verification: datasheet_read
  retrieved: '2026-10-28'
  source: https://docs.arduino.cc/resources/datasheets/A000066-datasheet.pdf
