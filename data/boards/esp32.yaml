    ai_note: "ROM 448 KB aparte. Sin unidad vectorial: TFLM con redes pequeñas (ESP-NN solo con optimizaciones genéricas). Los módulos WROVER-E traen 8 MB de PSRAM pero el chip solo mapea 4 MB al espacio de datos (el resto requiere la API himem); la PSRAM es más lenta y no sirve con la caché de flash desactivada."
