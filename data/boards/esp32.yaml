      - {field: psram_kb_max, value: "4096 KB (4 MiB mapeables a la vez)", url: "https://documentation.espressif.com/esp32_datasheet_en.pdf", note: "Datasheet v5.3, p. 27 (leído): admite hasta 8 MB de SRAM externa y puede mapear hasta 4 MB a la vez en el espacio de datos; hasta 16 MB de flash externa."}
      - {field: psram_kb_max, value: "WROVER-E 8 MB", url: "https://documentation.espressif.com/esp32-wrover-e_esp32-wrover-ie_datasheet_en.pdf", note: "WROVER-E v2.4, p. 3 (leído): N4R8/N8R8/N16R8 = 8 MB de PSRAM Quad; las N*R2 (2 MB) figuran EOL. DISCREPANCIA: módulo de 8 MB frente a 4 MB mapeables a la vez (el resto requiere himem)."}
    verified: true
    verification: datasheet_read
    retrieved: "2026-10-28"
    source: "https://documentation.espressif.com/esp32_datasheet_en.pdf"

