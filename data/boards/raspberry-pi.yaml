  - id: zero-w
    name: Raspberry Pi Zero W (Wi-Fi 2,4 GHz + Bluetooth)
    ram_kb: 524288
  usable:
    ram_kb: 131072
    flash_kb: null
    rule: '25 % de la RAM de la variante más pequeña (heurística nuestra, no dato oficial); el SO, el escritorio y otros procesos
      usan el resto. Flash: no aplica, el almacenamiento es una tarjeta SD.'
  ai_tier: linux_runtime
  ai_note: 'Un solo núcleo ARM11 (armv6, sin NEON) a 1 GHz y 512 MB: es débil. Sirve para inferencia muy pequeña con tflite-runtime/ONNX
    Runtime si hay ruedas para armv6 (no verificado); en la práctica es mejor modelos clásicos o redes diminutas. Una sola
    variante de RAM (512 MB), por eso ram_kb = 524288.'
  accelerators: []
  runtimes:
  - 'tflite-runtime / LiteRT (armv6: sin ruedas oficiales confirmadas)'
  - ONNX Runtime (no confirmado en armv6)
  - código C (clásicos)
  evidence:
