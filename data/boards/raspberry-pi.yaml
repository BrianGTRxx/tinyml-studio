      usan el Pi Zero y el Zero W.'
  - field: clock_mhz
    value: '1000'
    url: https://www.raspberrypi.com/products/raspberry-pi-zero/
    note: 'Página oficial del producto (leída): ''1GHz single-core CPU''.'
  - field: ram_kb
