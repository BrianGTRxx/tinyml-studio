name: Release
# Builds the installers and publishes them as a GitHub PRE-RELEASE.
#   Windows: setup .exe and portable .zip      Linux: .AppImage and .deb
# Run it by hand: Actions, Release, Run workflow, and type the tag (for example v0.0.1).
# Nothing is signed (no certificate): Windows SmartScreen will warn. The installers have NOT been tested on
# clean systems yet: the release notes say so.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.0.1"
        required: true
        default: "v0.0.1"

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, dist_script: "dist:win" }
          - { name: linux, os: ubuntu-latest, dist_script: "dist:linux" }
    env:
      PYTHONUTF8: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build tools (wheel of tinyml-studio)
        shell: bash
        run: python -m pip install --upgrade pip build

      - name: Interface dependencies
        working-directory: ui
        shell: bash
        run: npm ci

      - name: Build the installers
        working-directory: ui
        shell: bash
        run: npm run ${{ matrix.dist_script }}
        env:
          PYTHON: python

      - name: List the files
        shell: bash
        run: ls -la ui/dist

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            ui/dist/*.exe
            ui/dist/*.zip
            ui/dist/*.AppImage
            ui/dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installers-*
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * | tee SHA256SUMS.txt

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "TinyML Studio $TAG (pre-release)" --notes-file .github/release-notes.md --prerelease --target "$GITHUB_SHA"
